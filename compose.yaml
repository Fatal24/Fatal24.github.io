# docker compose up -d --build
# Settings come from .env next to this file (see .env.example).
services:
  cudgs:
    build:
      context: .
      args:
        SITE_URL: ${SITE_URL:-https://cudgs.org}
        PUBLIC_GOOGLE_CALENDAR_ID: ${PUBLIC_GOOGLE_CALENDAR_ID:-}
        PUBLIC_GOOGLE_API_KEY: ${PUBLIC_GOOGLE_API_KEY:-}
    container_name: cudgs
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      TZ: Europe/London
    # Localhost only: reached through the rathole tunnel, never directly.
    ports:
      - "127.0.0.1:${CUDGS_PORT:-4321}:4321"
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
